<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Kopé Admin : l'espace de gestion de l'équipe Kopé. Accès réservé.">
  <meta name="theme-color" content="#0E0E0E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kopé Admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Kopé Admin · Espace de l'équipe</title>
  <style>
    html,body{margin:0;height:100%;background:#0E0E0E}
    #kope-loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
      background:radial-gradient(circle at 50% 40%,#2a2400 0,#0E0E0E 60%);color:#fff;
      font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;transition:opacity .35s ease}
    #kope-loader img{width:112px;height:112px;border-radius:50%;box-shadow:0 0 0 6px rgba(255,212,0,.12),0 20px 50px rgba(0,0,0,.6)}
    #kope-loader b{font-size:26px;letter-spacing:-.01em}
    #kope-loader b span{color:#FFD400}
    #kope-loader small{color:#bdbdbd;font-size:14px}
    #kope-loader i{width:140px;height:4px;border-radius:4px;background:#2a2a2a;overflow:hidden;position:relative}
    #kope-loader i::after{content:"";position:absolute;inset:0;width:40%;background:#FFD400;border-radius:4px;animation:kl 1.1s ease-in-out infinite}
    @keyframes kl{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
    @media (prefers-reduced-motion:reduce){#kope-loader i::after{animation:none;width:100%}}
    #kope-loader.done{opacity:0;pointer-events:none}
  </style>
</head>
<body>
  <div id="kope-loader" role="status" aria-live="polite">
    <img src="logo.png" alt="">
    <b>Kopé <span>Admin</span></b>
    <small>La salle de contrôle de Kopé · réservé à l'équipe</small>
    <i></i>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var l = document.getElementById('kope-loader');
      if (l) { l.classList.add('done'); setTimeout(function () { l.remove(); }, 400); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
